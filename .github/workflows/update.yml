name: Update dashboard

on:
  schedule:
    - cron: "0 9 * * *"      # every day 09:00 UTC
  workflow_dispatch:         # and on demand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", "config/**", "dashboard/template.html", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, clean, build
        run: python scripts/update.py
      - name: Keep the cleaned tables with the site
        run: |
          mkdir -p dashboard/data
          cp data/clean/*.csv dashboard/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
